name: Weekly Commit-to-Asana Sync

on:
  schedule:
    # Every Friday at 17:00 UTC (7pm SAST)
    - cron: '0 17 * * 5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Run sync
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          SKIP_REPOS: ${{ vars.SKIP_REPOS || '' }}
        run: python3 sync_commits.py

      - name: Save sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
