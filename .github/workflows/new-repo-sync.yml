name: New Repo Board Creator

on:
  repository_dispatch:
    types: [new-repo-created]
  schedule:
    # Every Monday at 10am SAST (8am UTC)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Create a board for a specific repo (leave empty for auto-detect)'
        required: false

jobs:
  detect-and-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      - name: Sync new repos
        env:
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_OWNER: ${{ secrets.GITHUB_OWNER }}
          SKIP_REPOS: ${{ vars.SKIP_REPOS || '' }}
        run: |
          REPO="${{ github.event.inputs.repo_name || github.event.client_payload.repo_name || '' }}"
          if [ -n "$REPO" ]; then
            python3 sync_commits.py --repo "$REPO"
          else
            python3 sync_commits.py --new-only
          fi

      - name: Save sync state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .sync_state.json
          key: sync-state-${{ github.run_id }}
